
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equity Policies</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @font-face {
            font-family: 'BanglaCustom';
            src: url('B2.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'EnglishCustom';
            src: url('E1.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            margin: 0;
            padding: 0;
        }

        .font-bangla {
            font-family: 'BanglaCustom', sans-serif, 'SolaimanLipi';
        }

        .font-english {
            font-family: 'EnglishCustom', sans-serif, Arial;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between font-bangla">

    <header class="w-full bg-slate-900/80 border-b border-slate-800 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="h-3 w-3 rounded-full bg-amber-500 animate-pulse"></span>
                <span class="text-slate-200 font-semibold tracking-wide text-sm md:text-base">Home Page</span>
            </div>

            <button onclick="copyCurrentLink()"
                class="bg-indigo-600/20 hover:bg-indigo-600 border border-indigo-500/30 text-indigo-300 hover:text-white font-medium px-4 py-1.5 rounded-lg text-xs md:text-sm transition-all flex items-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                কপি লিংক
            </button>
        </div>
    </header>

    <div id="toast"
        class="fixed top-6 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-5 py-2.5 rounded-full shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-50 flex items-center gap-2 border border-emerald-500 text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span id="toast-message">লিংক সফলভাবে কপি হয়েছে!</span>
    </div>

    <main class="w-full max-w-4xl mx-auto px-6 py-12 flex-grow flex flex-col justify-center">
        <div class="text-center space-y-4 mb-12">
            <h2 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">
                ইকুইটি পলিসিগুলো দেখতে নিচের যেকোনোটিতে ক্লিক করুন
            </h2>
        </div>

        <hr class="border-slate-800/80 mb-10">

        <div id="links-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="col-span-full text-center py-10 text-slate-400">
                পলিসি লোড হচ্ছে...
            </div>
        </div>
    </main>

    <footer class="w-full py-6 text-center text-xs text-slate-600 border-t border-slate-900/60 bg-slate-950/20 mt-12">
        এই ওয়েবপেইজটি শুধুমাত্র ইকুইটি পলিসি প্রদর্শনের জন্য।
    </footer>

    <script>
        function isBanglaText(text) {
            return /[\u0980-\u09FF]/.test(text);
        }

        async function loadPolicies() {
            const container = document.getElementById('links-container');

            try {
                const response = await fetch('./data.json', {
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error('JSON-এ কোনো পলিসি ডাটা নেই।');
                }

                container.replaceChildren();

                data.forEach(item => {
                    if (!item.title || !item.folder) return;

                    const card = document.createElement('a');
                    card.href = './' + encodeURIComponent(item.folder) + '/';

                    const fontClass = isBanglaText(item.title)
                        ? 'font-bangla'
                        : 'font-english';

                    card.className =
                        'group flex items-center justify-between p-5 rounded-xl border border-slate-800 bg-slate-900/40 hover:bg-slate-900 hover:border-indigo-500/50 hover:shadow-lg hover:shadow-indigo-500/5 transition-all duration-300 transform hover:-translate-y-0.5 ' +
                        fontClass;

                    const left = document.createElement('div');
                    left.className = 'flex items-center gap-4';

                    const iconBox = document.createElement('div');
                    iconBox.className =
                        'p-3 rounded-lg bg-slate-800/80 group-hover:bg-indigo-600/10 text-slate-400 group-hover:text-indigo-400 transition-colors';

                    iconBox.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2"
                                d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                        </svg>
                    `;

                    const title = document.createElement('span');
                    title.className =
                        'text-slate-200 group-hover:text-white font-medium text-base md:text-lg transition-colors leading-snug';
                    title.textContent = item.title;

                    left.append(iconBox, title);

                    const arrow = document.createElement('div');
                    arrow.className =
                        'text-slate-600 group-hover:text-indigo-400 transition-colors';

                    arrow.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="h-5 w-5 transform group-hover:translate-x-1 transition-transform"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    `;

                    card.append(left, arrow);
                    container.appendChild(card);
                });

                if (!container.children.length) {
                    throw new Error('কোনো বৈধ পলিসি পাওয়া যায়নি।');
                }

            } catch (error) {
                console.error('Policy loading error:', error);

                container.innerHTML = `
                    <div class="col-span-full text-center py-10 bg-slate-900/20 rounded-xl border border-dashed border-slate-800 text-rose-400">
                        পলিসি লোড করা যায়নি। data.json ফাইল ও তার path পরীক্ষা করুন।
                    </div>
                `;
            }
        }

        async function copyCurrentLink() {
            const currentUrl = new URL('./', window.location.href).href;

            try {
                await navigator.clipboard.writeText(currentUrl);
                showToastNotification('লিংক সফলভাবে কপি হয়েছে!');
            } catch (error) {
                const input = document.createElement('textarea');
                input.value = currentUrl;
                input.style.position = 'fixed';
                input.style.opacity = '0';
                document.body.appendChild(input);
                input.select();

                const success = document.execCommand('copy');
                input.remove();

                showToastNotification(
                    success ? 'লিংক সফলভাবে কপি হয়েছে!' : 'লিংক কপি করা যায়নি।'
                );
            }
        }

        let toastTimer;

        function showToastNotification(message) {
            const toast = document.getElementById('toast');

            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');

            clearTimeout(toastTimer);

            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        loadPolicies();
    </script>
</body>
</html>
