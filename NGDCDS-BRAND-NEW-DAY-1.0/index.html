
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090f">
<title>NGDCDS | Equity Policy</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090f;color:#fff;font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif}
#pages{height:100%;width:100%;overflow-y:auto;overflow-x:hidden;padding:20px 0 90px;display:flex;flex-direction:column;align-items:center}
.page{position:relative;margin:0 auto 20px;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,0.5);border-radius:4px;overflow:hidden}
.page canvas{display:block;width:100%;height:100%;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}
#loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;padding:24px;background:#09090f;transition:opacity .3s,visibility .3s}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid #30303d;border-top-color:#a78bfa;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#status{font-size:13px;color:#c2c2d2;text-align:center}
.track{width:min(280px,85vw);height:5px;border-radius:9px;background:#30303d;overflow:hidden}
#bar{width:0;height:100%;background:#a78bfa;transition:width .15s}
#download{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;align-items:center;gap:8px;padding:13px 20px;border-radius:40px;background:#7957e8;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;box-shadow:0 5px 24px rgba(0,0,0,0.5);transition:transform .2s, background-color .2s}
#download:hover{background:#6843e3;transform:translateY(-2px)}
#error{display:none;max-width:320px;text-align:center;color:#ff9999;font-size:14px;line-height:1.6}
</style>
</head>
<body>

<div id="pages"></div>

<div id="loader">
  <div class="spinner" id="spinner"></div>
  <strong>Loading High Resolution Equity Policy</strong>
  <div id="status">Preparing PDF... 0%</div>
  <div class="track"><div id="bar"></div></div>
  <div id="error"></div>
</div>

<a id="download" href="./pdf.pdf" download="NGDCDS-Equity-Policy.pdf">
  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <path d="m7 10 5 5 5-5M12 15V3"/>
  </svg>
  Download PDF
</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(async function(){
  const PDF_URL = new URL("./pdf.pdf", location.href).href;
  const loader = document.getElementById("loader");
  const status = document.getElementById("status");
  const bar = document.getElementById("bar");
  const error = document.getElementById("error");
  const pages = document.getElementById("pages");

  // Multiplier for super sampling high resolution (Forces minimum 3x device pixel ratio for crystal clear text)
  const HIGH_RES_FACTOR = Math.max(window.devicePixelRatio || 1, 3.0);

  function fail(message){
    document.getElementById("spinner").style.display="none";
    status.style.display="none";
    document.querySelector(".track").style.display="none";
    error.style.display="block";
    error.textContent=message;
  }

  try{
    if(!window.pdfjsLib) throw new Error("PDF viewer library could not load. Please check your internet connection.");

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const response = await fetch(PDF_URL);
    if(!response.ok) throw new Error("PDF file not found: "+response.status);

    const total = Number(response.headers.get("Content-Length")) || 0;
    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;

    while(true){
      const part = await reader.read();
      if(part.done) break;
      chunks.push(part.value);
      received += part.value.length;

      if(total){
        const pct = Math.min(99, Math.round(received/total*100));
        bar.style.width=pct+"%";
        status.textContent="Downloading PDF... "+pct+"%";
      }else{
        status.textContent="Downloading PDF... "+Math.round(received/1024)+" KB";
      }
    }

    const file = new Uint8Array(received);
    let offset = 0;
    for(const chunk of chunks){
      file.set(chunk,offset);
      offset += chunk.length;
    }

    status.textContent="Preparing pages...";
    bar.style.width="100%";

    const pdf = await pdfjsLib.getDocument({data:file}).promise;
    const fragment = document.createDocumentFragment();

    for(let n=1;n<=pdf.numPages;n++){
      status.textContent="Rendering high-res pages... "+n+" / "+pdf.numPages;
      const page = await pdf.getPage(n);

      // Determine CSS display width
      const baseViewport = page.getViewport({scale: 1.0});
      const cssWidth = Math.min(window.innerWidth - 32, 1000);
      const cssScale = cssWidth / baseViewport.width;
      const cssViewport = page.getViewport({scale: cssScale});

      // Compute actual high-res canvas scale (CSS scale multiplied by forced high DPI factor)
      const renderViewport = page.getViewport({scale: cssScale * HIGH_RES_FACTOR});

      const holder = document.createElement("div");
      holder.className="page";
      holder.style.width = cssViewport.width + "px";
      holder.style.height = cssViewport.height + "px";

      const canvas = document.createElement("canvas");
      canvas.width = Math.floor(renderViewport.width);
      canvas.height = Math.floor(renderViewport.height);
      
      // Keep style dimensions constrained to standard CSS display size
      canvas.style.width = cssViewport.width + "px";
      canvas.style.height = cssViewport.height + "px";

      holder.appendChild(canvas);
      fragment.appendChild(holder);

      const context = canvas.getContext("2d", { alpha: false });
      
      // Enable high quality image smoothing algorithms
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = "high";

      await page.render({
        canvasContext: context,
        viewport: renderViewport
      }).promise;
    }

    pages.appendChild(fragment);
    loader.classList.add("hidden");

  }catch(e){
    console.error(e);
    fail("PDF লোড করা যায়নি। ইন্টারনেট, PDF ফাইলের path এবং hosting চেক করো। "+e.message);
  }
})();
</script>
</body>
</html>
