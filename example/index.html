
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090f">
<title>Equity Policy</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090f;color:#fff;font-family:Arial,sans-serif}
#pages{height:100%;width:100%;overflow:auto;padding:12px 0 85px}
.page{position:relative;margin:0 auto 12px;background:#fff;box-shadow:0 2px 12px #0005}
.page canvas{display:block;width:100%;height:auto}
#loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:17px;padding:24px;background:#09090f;transition:opacity .3s,visibility .3s}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.spinner{width:40px;height:40px;border:3px solid #30303d;border-top-color:#a78bfa;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#status{font-size:13px;color:#c2c2d2;text-align:center}
.track{width:min(280px,85vw);height:5px;border-radius:9px;background:#30303d;overflow:hidden}
#bar{width:0;height:100%;background:#a78bfa;transition:width .15s}
#download{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;align-items:center;gap:8px;padding:13px 17px;border-radius:40px;background:#7957e8;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;box-shadow:0 5px 24px #0008}
#error{display:none;max-width:320px;text-align:center;color:#ff9999;font-size:14px;line-height:1.6}
</style>
</head>
<body>

<div id="pages"></div>

<div id="loader">
  <div class="spinner" id="spinner"></div>
  <strong>Loading Equity Policy</strong>
  <div id="status">Preparing PDF... 0%</div>
  <div class="track"><div id="bar"></div></div>
  <div id="error"></div>
</div>

<a id="download" href="./pdf.pdf" download="Equity-Policy.pdf">
  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <path d="m7 10 5 5 5-5M12 15V3"/>
  </svg>
  Download PDF
</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(async function(){
  const PDF_URL = new URL("./pdf.pdf", location.href).href;
  const loader = document.getElementById("loader");
  const status = document.getElementById("status");
  const bar = document.getElementById("bar");
  const error = document.getElementById("error");
  const pages = document.getElementById("pages");

  function fail(message){
    document.getElementById("spinner").style.display="none";
    status.style.display="none";
    document.querySelector(".track").style.display="none";
    error.style.display="block";
    error.textContent=message;
  }

  try{
    if(!window.pdfjsLib) throw new Error("PDF viewer library could not load. Please check your internet connection.");

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const response = await fetch(PDF_URL);
    if(!response.ok) throw new Error("PDF file not found: "+response.status);

    const total = Number(response.headers.get("Content-Length")) || 0;
    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;

    while(true){
      const part = await reader.read();
      if(part.done) break;
      chunks.push(part.value);
      received += part.value.length;

      if(total){
        const pct = Math.min(99, Math.round(received/total*100));
        bar.style.width=pct+"%";
        status.textContent="Downloading PDF... "+pct+"%";
      }else{
        status.textContent="Downloading PDF... "+Math.round(received/1024)+" KB";
      }
    }

    const file = new Uint8Array(received);
    let offset = 0;
    for(const chunk of chunks){
      file.set(chunk,offset);
      offset += chunk.length;
    }

    status.textContent="Preparing pages...";
    bar.style.width="100%";

    const pdf = await pdfjsLib.getDocument({data:file}).promise;
    const fragment = document.createDocumentFragment();

    for(let n=1;n<=pdf.numPages;n++){
      status.textContent="Rendering pages... "+n+" / "+pdf.numPages;
      const page = await pdf.getPage(n);
      const base = page.getViewport({scale:1});
      const width = Math.min(window.innerWidth-16, 900);
      const viewport = page.getViewport({scale:width/base.width});
      const ratio = Math.min(window.devicePixelRatio||1,2);

      const holder = document.createElement("div");
      holder.className="page";
      holder.style.width=viewport.width+"px";

      const canvas = document.createElement("canvas");
      canvas.width=Math.floor(viewport.width*ratio);
      canvas.height=Math.floor(viewport.height*ratio);
      canvas.style.width=viewport.width+"px";
      canvas.style.height=viewport.height+"px";
      holder.appendChild(canvas);
      fragment.appendChild(holder);

      const context = canvas.getContext("2d");
      await page.render({
        canvasContext:context,
        viewport:viewport,
        transform:ratio===1?null:[ratio,0,0,ratio,0,0]
      }).promise;
    }

    pages.appendChild(fragment);
    loader.classList.add("hidden");

  }catch(e){
    console.error(e);
    fail("PDF লোড করা যায়নি। ইন্টারনেট, PDF ফাইলের path এবং hosting চেক করো। "+e.message);
  }
})();
</script>
</body>
</html>
